name: Bug
description: Report reproducible wrong behavior
title: "[Bug] "
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and environment
  - type: textarea
    id: tests
    attributes:
      label: Regression test
